backend:
  name: github
  repo: Chaz1yaheard/painting-portfolio
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "paintings"
    label: "Paintings"
    files:
      - file: "content/paintings.json"
        label: "Paintings List"
        name: "paintings"
        fields:
          - label: "Paintings"
            name: "paintings"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }